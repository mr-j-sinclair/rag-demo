name: CI

on:
  # Run when code is pushed directly to main.
  push:
    branches:
      - main
  # Run when a pull request proposes changes to main
  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Download this repository's files to the temporary runner.
        uses: actions/checkout@v4

      - name: Install uv
        # Install uv from .python-version
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        # Install the exact dependencies recorded in uv.lock
        run: uv sync --locked 

      - name: Lint
        # Check all Python files for code-quality problems.
        run: uv run ruff check .

      - name: Run tests
        # Run the project's automated test suite
        run: uv run pytest