name: CI

on:
  # Run when code is pushed directly to main.
  push:
    branches:
      - main
  # Run when a pull request proposes changes to main
  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Download this repository's files to the temporary runner.
        uses: actions/checkout@v4

      - name: Install uv
        # Install uv from .python-version
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        # Install the exact dependencies recorded in uv.lock
        run: uv sync --locked

      - name: Restore embedding model cache
        # Resue the model downloaded by an earlier CI run.
        id: embedding-model-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: embedding-model-all-MiniLM-L6-v2-v2

      - name: Download embedding model
        # Download the model from Hugging Face
        # Only if it cannot be retrieved from cache.
        if: steps.embedding-model-cache.outputs.cache-hit != 'true'
        run: uv run hf download sentence-transformers/all-MiniLM-L6-v2

      - name: Lint
        # Check all Python files for code-quality problems.
        run: uv run ruff check .

      - name: Run tests
        # Run the project's automated test suite
        run: uv run pytest
