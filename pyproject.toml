[project]
name = "rag-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "numpy<2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sentence-transformers<3.1",
    "torch==2.2.2",
    "transformers<4.50",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

# Ensure Cloud Run (on Linux) downloads only the smaller CPU-only PyTorch build
# macOS continues using the normal PyPI package
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

# Define the official PyTorch CPU package index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

# prevent unrelated packages from being downloaded from this specialist index.
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    #"ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle
    "ERA",  # eradicate
    "F",    # flake8
    "FBT",  # flake8-boolean-trap
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # Perflint
    "PIE",  # flake8-pie
    "PL",   # PyLint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quote
    "RET",  # flake8-return
    "RUF",  # ruff
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    #"T20",  # flake8-print
    "TC",   # flake8-type-checking
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ARG001"] # assert is how pytests tests are written, not a bug

[tool.mypy]
python_version = "3.11"
exclude = ["^models/"]
# TODO: As this is first pass, we'll start permissive, then tighten up later
